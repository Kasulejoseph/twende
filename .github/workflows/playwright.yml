name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.project }} ${{ matrix.shard }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ matrix.concurrency }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: stateless
            shard: 1/2
            workers: 2
            concurrency: twende-stateless-1
          - project: stateless
            shard: 2/2
            workers: 2
            concurrency: twende-stateless-2
          - project: stateful
            shard: 1/1
            workers: 1
            concurrency: twende-sandbox
          - project: llm
            shard: 1/1
            workers: 1
            concurrency: twende-sandbox
          - project: slow
            shard: 1/1
            workers: 1
            concurrency: twende-sandbox
    env:
      CI: true
      BASE_URL: https://staging-twende-backend.safeboda.com/api/qa-sandbox
      CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PLAYWRIGHT_BLOB_NAME: ${{ matrix.project }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare env
        run: cp .env.example .env
      - name: Run ${{ matrix.project }} shard ${{ matrix.shard }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Merge reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge Playwright reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          zips=(all-blob-reports/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No Playwright blob reports were produced."
            exit 0
          fi
          npx playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
