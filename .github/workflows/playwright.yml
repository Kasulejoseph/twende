name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.project }} ${{ matrix.shard }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ matrix.concurrency }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: stateless
            shard: 1/2
            workers: 2
            concurrency: twende-stateless-1
          - project: stateless
            shard: 2/2
            workers: 2
            concurrency: twende-stateless-2
          - project: stateful
            shard: 1/1
            workers: 1
            concurrency: twende-sandbox
          - project: boda-assist
            shard: 1/1
            workers: 1
            concurrency: twende-sandbox
    env:
      CI: true
      BASE_URL: https://staging-twende-backend.safeboda.com/api/qa-sandbox
      CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARAH_TOKEN: ${{ secrets.SARAH_TOKEN }}
      BRIAN_TOKEN: ${{ secrets.BRIAN_TOKEN }}
      JOSEPH_TOKEN: ${{ secrets.JOSEPH_TOKEN }}
      GRACE_TOKEN: ${{ secrets.GRACE_TOKEN }}
      DAVID_TOKEN: ${{ secrets.DAVID_TOKEN }}
      PLAYWRIGHT_BLOB_NAME: ${{ matrix.project }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare env
        run: cp .env.example .env
      - name: Run ${{ matrix.project }} shard ${{ matrix.shard }}
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  slow:
    name: slow 1/1
    needs: test
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: twende-sandbox
      cancel-in-progress: false
      queue: max
    env:
      CI: true
      BASE_URL: https://staging-twende-backend.safeboda.com/api/qa-sandbox
      CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARAH_TOKEN: ${{ secrets.SARAH_TOKEN }}
      BRIAN_TOKEN: ${{ secrets.BRIAN_TOKEN }}
      JOSEPH_TOKEN: ${{ secrets.JOSEPH_TOKEN }}
      GRACE_TOKEN: ${{ secrets.GRACE_TOKEN }}
      DAVID_TOKEN: ${{ secrets.DAVID_TOKEN }}
      PLAYWRIGHT_BLOB_NAME: slow-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare env
        run: cp .env.example .env
      - name: Run slow
        run: npx playwright test --project=slow --shard=1/1 --workers=1
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-slow-1
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test, slow]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge Playwright reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          zips=(all-blob-reports/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No Playwright blob reports were produced."
            exit 0
          fi
          npx playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail when tests failed
        if: needs.test.result != 'success' || needs.slow.result != 'success'
        run: exit 1
